name: Refresh Pinergy dashboard

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Pinergy data
        env:
          PINERGY_EMAIL: ${{ secrets.PINERGY_EMAIL }}
          PINERGY_PASSWORD: ${{ secrets.PINERGY_PASSWORD }}
        run: python fetch_pinergy.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Persist history
        run: |
          if [ -n "$(git status --porcelain data/history.ndjson)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/history.ndjson
            git commit -m "chore: append daily history"
            git push origin HEAD:main
          else
            echo "data/history.ndjson unchanged — nothing to commit"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
